server:
  port: 8080

spring:
  application:
    name: ai-travel-companion-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel_companion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    provider: ${AI_PROVIDER:auto} # auto, gemini, openai, heuristic
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  weather:
    api-key: ${WEATHER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
